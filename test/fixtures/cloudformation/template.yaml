AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Env:
    Type: String
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "site-${Env}-${AWS::AccountId}"
      Ports: [80, 443]
  Policy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Resource: !Sub
              - "${Arn}/*"
              - Arn: !GetAtt Bucket.Arn
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Policy
    Properties:
      Origin: !Join ["", [!GetAtt [Bucket, RegionalDomainName], "/x"]]
      Comment: !Sub |
        served from ${Bucket} with ${!Literal}
Outputs:
  Url:
    Value: !GetAtt Distribution.DomainName
